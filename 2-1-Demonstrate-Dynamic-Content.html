<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-1 Demonstrate Dynamic Content</title>
    <!-- <script src="script2-1.js"></script> -->
    <script>
        const olympicSeasons = ["Winter Olympics", "Summer Olympics"];

        const winterSports = ["Alpine Skiing", "Figure Skating", "Snowboarding"];
        const summerSports = ["Swimming", "Volleyball", "Gymnastics"];

        const sports = winterSports.concat(summerSports); 

        function loadWinterSports(list) {
            const sportSelect = document.getElementById('sportSelect');
            sportSelect.innerHTML = ""; 

            list.forEach((sport) => {
                const option = document.createElement("option");
                option.value = sport;
                option.textContent = sport;
                sportSelect.add(option);
            });
        }

        function loadSummerSports(list) {
            const sportSelect = document.getElementById('sportSelect');
            sportSelect.innerHTML = ""; 

            list.forEach((sport) => {
                const option = document.createElement("option");
                option.value = sport;
                option.textContent = sport;
                sportSelect.add(option);
            });
        }

        // Populate using createElement and appendChild - can also us .add() since that works well for SELECT elements
        document.addEventListener("DOMContentLoaded", () => {
        // add sports array to sports dropdown
            const sportSelect = document.getElementById('sportSelect'); 
            
            sports.forEach((sport) => {
                const option = document.createElement("option");
                option.value = sport;
                option.textContent = sport;
                sportSelect.add(option);
            });
        

        // Add event listener on button to dynamically add an option to the pizza topping dropdown
        document.getElementById("addSportBtn").addEventListener("click", () => {
            const newSportInput = document.getElementById("newSport");
            const newSport = newSportInput.value.trim();
            const category = document.getElementById("seasonSelect").value;
            

            if (newSport === "") {
                alert("Please enter a sport name!");
                return;
            }

            if (sports.includes(newSport)) {
                alert("That sport already exists!");
                return;
            }

            sports.push(newSport);

            let option = document.createElement("option");
            option.value = newSport;
            option.textContent = newSport;
            sportSelect.add(option);

            newSportInput.value = "";
        });

        // Handle load winter sports button
            document.getElementById("loadWinterBtn").addEventListener("click", () => {
                loadWinterSports(winterSports);
            }); 
        // Handle load summer sports button
            document.getElementById("loadSummerBtn").addEventListener("click", () => {
                loadSummerSports(summerSports);
            });
        });
    </script>

  </head>
  <body>
      <h1>Olympic Sports</h1>
  
      <h2>Step 1: Dropdown Created with document.write()</h2>
      <label>Olympic Seasons</label>
      <select id="seasonSelect">
        <!-- Populate using document.write() -->
        <script>
        for(let i = 0; i < olympicSeasons.length; i++) {
            document.write("<option value='" + olympicSeasons[i] + "'>" + olympicSeasons[i] + "</option>");
         }
        </script> 
      </select>
  
      <h2>Step 2: Dropdown Created with createElement() and appendChild()</h2>
      <label>Olympic Sports</label>
      <select id="sportSelect">
      </select>
  
      <h2>Step 3: Add a New Sport</h2>
      <input type="text" id="newSport" placeholder="Enter new sport">
      <button id="addSportBtn">Add Sport</button>
  
      <h2>Step 4: Switch Between Olympic Seasons</h2>
      <!--
          Add event listener on the 'loadWinterBtn' button to reload the winter sports
          Add event listener on the 'loadSummerBtn' button to reload the summer sports
      -->
      <button id="loadWinterBtn">Load Winter Sports</button>
      <button id="loadSummerBtn">Load Summer Sports</button>
  </body>
  </html>
