<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Caitlyn Wheeler">
<meta name="date" content="2026-01-26">
<title>WDV321 Advanced JavaScript</title>
<style>
    #container {
        background-color: blanchedalmond;
        width:70%;
        margin-left:auto;
        margin-right:auto;
        padding:5px;
    }
    section {
        display:flex;
        justify-content: center;
    }
    .leftSide, .rightSide {
        border: thin solid brown;
        width:50%;
        padding-left:15px;         
    }

    #resetBtn {
        margin-top: 5px;
    }
</style>

<script>
    // Defined data arrays
    const teamNames = ["Chiefs", "Raiders", "Cubs"];
    const cookies = ["Chocolate Chip Cookie", "Sugar Cookie", "Peanut Butter Cookie"];
    const candies = ["M&Ms", "Baby Ruth", "Snickers"];

    // Function to load teams dropdown
    function loadTeams(list) {
        const select = document.getElementById('teamSelect');
        select.innerHTML = "";
        list.forEach(team => {
            const option = document.createElement('option');
            option.value = team;
            option.textContent = team;
            select.add(option);
        });
    }

    // Function to load products dropdown
    function loadProducts(list) {
        const select = document.getElementById('productSelect');
        select.innerHTML = "";
        list.forEach(item => {
            const option = document.createElement('option');
            option.value = item;
            option.textContent = item;
            select.add(option);
        });
    }

    // Run JS after DOM loads
    document.addEventListener("DOMContentLoaded", () => {
        const teamSelect = document.getElementById('teamSelect');
        const productSelect = document.getElementById('productSelect');

        // Initial population dropdowns
        loadTeams(teamNames);
        loadProducts(cookies);

        // Add new team
        document.getElementById('addTeamBtn').addEventListener('click', () => {
            const newTeamInput = document.getElementById('newTeam');
            const newTeam = newTeamInput.value.trim();

            // Validate input
            if(newTeam === "") { 
                alert("Enter a team!"); return; 
            }
            // Prevents duplications
            if(teamNames.includes(newTeam)) {
                alert("Team exists!"); 
                return; 
            }

            // Add new team to array
            teamNames.push(newTeam);

            // Create new option in dropdown
            const option = document.createElement('option');
            option.value = newTeam;
            option.textContent = newTeam;
            teamSelect.add(option);

            newTeamInput.value = "";
        });

            // Reset page to original state
            document.getElementById('resetBtn').addEventListener('click', () => {
            // Reset team array to original values
            teamNames.length = 0;
            teamNames.push("Chiefs", "Raiders", "Cubs");

            // Reload dropdowns
            loadTeams(teamNames);
            loadProducts(cookies);

            // Clear outputs
            document.getElementById('outputTeam').textContent = "";
            document.getElementById('outputProduct').textContent = "";

            // Clear input field
            document.getElementById('newTeam').value = "";

            // Uncheck radio buttons
            document.getElementById('showCookies').checked = false;
            document.getElementById('showCandy').checked = false;
        });

        // Shows selected team
        teamSelect.addEventListener('click', () => {
            document.getElementById('outputTeam').textContent = teamSelect.value;
        });

        // Shows selected products
        productSelect.addEventListener('click', () => {
            document.getElementById('outputProduct').textContent = productSelect.value;
        });

        // Switches product types
        document.getElementById('showCookies').addEventListener('click', () => {
            if(document.getElementById('showCookies').checked) loadProducts(cookies);
        });
        document.getElementById('showCandy').addEventListener('click', () => {
            if(document.getElementById('showCandy').checked) loadProducts(candies);
        });
    });
</script>

</head>
<body>
<div id="container">
<main>
<h1>WDV321 Advanced JavaScript</h1>
<h2>Dynamic Content - Drop Down Lists</h2>

<section>
    <div class="leftSide">
        <h3>Team Names</h3>
        <label for="teamSelect">Teams:</label>
        <select id="teamSelect"></select>
        <p>Selected Team: <span id="outputTeam"></span></p>

        <input type="text" id="newTeam" placeholder="Enter new team">
        <button id="addTeamBtn">Add Team</button>
        <button id="resetBtn">Reset</button>
    </div>
    
    

    <div class="rightSide">
        <h3>Products</h3>
        <label for="productSelect">Products:</label>
        <select id="productSelect"></select>
        <p>Selected Product: <span id="outputProduct"></span></p>

        <p>
            <input type="radio" name="productType" id="showCookies"> Cookies
            <br>
            <input type="radio" name="productType" id="showCandy"> Candy
        </p>
    </div>
</section>
</main>
</div>

</body>
</html>
