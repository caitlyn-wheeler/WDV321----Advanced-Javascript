<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-1 Demonstrate Dynamic Content</title>
    <!-- <script src="script2-1.js"></script> -->
    
    <script> 
        // Data for Olympic seasons and sports
        const olympicSeasons = ["Winter Olympics", "Summer Olympics"];
        const winterSports = ["Alpine Skiing", "Figure Skating", "Snowboarding"];
        const summerSports = ["Swimming", "Volleyball", "Gymnastics"];

        // Function to load sports into "Olympic Sports" dropdown
        function loadSports(list) {
            sportSelect = document.getElementById("sportSelect");
            sportSelect.innerHTML = "";

            // Populate dropdown with options using createElement() and appendChild()
            for (i = 0; i < list.length; i++) {
                option = document.createElement("option");
                option.value = list[i];
                option.textContent = list[i];
                sportSelect.appendChild(option);
            }
    }

            // Run after DOM loads
            document.addEventListener("DOMContentLoaded", () => {
    
            // Initially populates sports dropdown with a list of olympic sports
            const sportSelect = document.getElementById("sportSelect");
            const allSports = winterSports.concat(summerSports);
            allSports.forEach((sport) => {
                const option = document.createElement("option");
                option.value = sport;
                option.textContent = sport;
                sportSelect.appendChild(option);
            });

            // Add new sport
            document.getElementById("addSportBtn").addEventListener("click", function() {
                newSportInput = document.getElementById("newSport");
                newSport = newSportInput.value.trim();
                season = document.getElementById("seasonSelect").value;

                if (newSport === "") {
                    alert("Please enter a sport name!");
                    return;
                }

                // Determine which season's array to add the new sport to
                if (season === "Winter Olympics") {
                    targetArray = winterSports;
                } else {
                    targetArray = summerSports;
                }

                // Check if sport already exists in that season 
                if (targetArray.includes(newSport)) {
                    alert("That sport already exists in this season!");
                    return;
                }

                // Add new sport to the correct season array
                targetArray.push(newSport);
                newSportInput.value = "";
                alert("Added " + newSport + " to " + season + "! Click the load button to see it.");
            });

            // Load buttons to switch between Olympic Seasons
            document.getElementById("loadWinterBtn").addEventListener("click", function() {
            loadSports(winterSports);
            });

            document.getElementById("loadSummerBtn").addEventListener("click", function() {
            loadSports(summerSports);
            });
        });
    
    </script>

  </head>
  <body>
      <h1>Olympic Sports</h1>
  
      <h2>Step 1: Dropdown Created with document.write()</h2>
      <label>Olympic Seasons</label>
      <select id="seasonSelect">
        <!-- Populate using document.write() -->
        <script>
        for(let i = 0; i < olympicSeasons.length; i++) {
            document.write("<option value='" + olympicSeasons[i] + "'>" + olympicSeasons[i] + "</option>");
         }
        </script> 
      </select>
  
      <h2>Step 2: Dropdown Created with createElement() and appendChild()</h2>
      <label>Olympic Sports</label>
      <select id="sportSelect">
      </select>
  
      <h2>Step 3: Add a New Sport</h2>
      <input type="text" id="newSport" placeholder="Enter new sport">
      <button id="addSportBtn">Add Sport</button>
  
      <h2>Step 4: Switch Between Olympic Seasons</h2>
      <!--
          Add event listener on the 'loadWinterBtn' button to reload the winter sports
          Add event listener on the 'loadSummerBtn' button to reload the summer sports
      -->
      <button id="loadWinterBtn">Load Winter Sports</button>
      <button id="loadSummerBtn">Load Summer Sports</button>
  </body>
  </html>
